name: Build Universal Windows EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Download FFmpeg
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
        Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp -Force
        $dir = Get-ChildItem ffmpeg_temp | Select-Object -First 1
        Copy-Item "$($dir.FullName)/bin/ffmpeg.exe" -Destination . -Force
        Remove-Item ffmpeg.zip, ffmpeg_temp -Recurse -Force
    - name: Build and Publish
      run: dotnet publish UniversalRecorder.csproj -c Release -f net472 -o publish
    - name: Copy FFmpeg to Publish
      shell: pwsh
      run: Copy-Item ffmpeg.exe publish/ -Force
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: UniversalRecorder
        path: publish/
        retention-days: 30
